name: validate

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate.mjs
      - run: node scripts/floor-guard-test.mjs
      - run: node scripts/hooks-test.mjs
      - run: node scripts/routing.mjs
      - name: Version and CHANGELOG on a changed plugin
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: node scripts/release-check.mjs "origin/${{ github.base_ref }}"

  tag:
    # main is production: every version that reaches it gets a tag stage-pipeline--v<version>.
    # The team catalog can pin to tags ("ref" in ROLLOUT.md), so they are not left to be made by hand.
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version tag, if it does not exist yet
        run: |
          version=$(node -p "require('./plugins/stage-pipeline/.claude-plugin/plugin.json').version")
          tag="stage-pipeline--v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists"
            exit 0
          fi
          git tag "${tag}"
          git push origin "${tag}"
          echo "created ${tag}"
